[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ibm-4610"
dynamic = ["version"]
description = "Python driver for IBM/Toshiba 4610 SureMark POS printers with USB interface"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Pavel Kim", email = "hello@pavelkim.com" }
]
keywords = [
    "ibm", "toshiba", "4610", "suremark", "thermal",
    "pos", "receipt", "printer", "escpos", "usb",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
requires-python = ">=3.9"
dependencies = [
    "pyusb>=1.3,<1.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
Homepage    = "https://github.com/printer-stream/py-ibm-4610"
Repository  = "https://github.com/printer-stream/py-ibm-4610"
"Bug Tracker" = "https://github.com/printer-stream/py-ibm-4610/issues"

[tool.setuptools.dynamic]
version = { attr = "py_ibm_4610.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["py_ibm_4610*"]
